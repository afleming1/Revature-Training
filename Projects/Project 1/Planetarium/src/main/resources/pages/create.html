<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Create Account</title>

		<link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
		<link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">

		<link rel="stylesheet" href="/css/site.css">
	</head>
	<body class="auth-page" data-page="create">
		<nav class="navbar navbar-expand-lg bg-opacity-75 border-bottom border-secondary sticky-top">
			<div class="container">
				<a class="navbar-brand fw-semibold" href="/planetarium">
					<i class="bi bi-stars me-2"></i>
					Planetarium
				</a>

				<button class="btn btn-outline-light" id="logout-button" type="button">
					<i class="bi bi-box-arrow-right me-1"></i>
					Logout
				</button>
			</div>
		</nav>

		<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
			<div class="auth-card card border-secondary shadow-lg">
				<div class="card-body p-4 p-md-5">
					<div class="text-center mb-4">
						<div class="brand-icon mx-auto mb-3">
							<i class="bi bi-stars"></i>
						</div>

						<h1 class="h3 fw-bold mb-1">Create Account</h1>
						<p class="text-secondary mb-0">Start building your planetarium.</p>
					</div>

					<form id="create-account-form" novalidate>
						<div class="mb-3">
							<label for="create-username-input" class="form-label">Username</label>

							<div class="input-group">
								<span class="input-group-text">
									<i class="bi bi-person-plus"></i>
								</span>

								<input type="text" id="create-username-input" class="form-control" placeholder="Enter username" autocomplete="username" minlength="5" maxlength="30" required>
							</div>

							<div class="form-text">
								5-30 characters. Must start with a letter. Letters, numbers, underscores, and hyphens allowed.
							</div>
						</div>

						<div class="mb-4">
							<label for="create-password-input" class="form-label">Password</label>

							<div class="input-group">
								<span class="input-group-text">
									<i class="bi bi-shield-lock"></i>
								</span>

								<input type="password" id="create-password-input" class="form-control" placeholder="Enter password" autocomplete="new-password" minlength="5" maxlength="30" required>
							</div>

							<div class="form-text">
								5-30 characters with at least one lowercase letter, one uppercase letter, and one number.
							</div>
						</div>

						<button class="btn btn-primary w-100" type="submit">
							<i class="bi bi-person-check me-1"></i>
							Create Account
						</button>
					</form>
				</div>
			</div>

			<div class="toast-container position-fixed bottom-0 end-0 p-3">
				<div id="app-toast" class="toast text-bg-dark border-secondary" role="alert" aria-live="assertive" aria-atomic="true">
					<div class="toast-header">
						<strong class="me-auto" id="toast-title">Planetarium</strong>

						<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
					</div>

					<div class="toast-body" id="toast-message"></div>
				</div>
			</div>
		</main>
	</body>
</html>
