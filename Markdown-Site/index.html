<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Study Guide Viewer</title>

        <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">

        <link rel="stylesheet" href="/css/site.css">
    </head>
    <body>
        <nav class="navbar bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">
                    <i class="bi bi-file-earmark-code-fill"></i>
                    Study Guide Viewer
                </span>
            </div>
        </nav>

        <div class="container">
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-header fw-bold">Files</div>

                        <div class="list-group list-group-flush" id="file-list"></div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="card shadow-sm">
                        <div class="card-header text-muted small" id="current-filename"></div>

                        <div class="card-body p-0">
                            <article id="markdown-content" class="markdown-body">
                                <p>Loading...</p>
                            </article>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
        <script src="/lib/dom-purify/purify.min.js"></script>
        <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

        <script src="/js/app.js"></script>
    </body>
</html>
